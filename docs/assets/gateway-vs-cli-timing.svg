<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 980" width="1080" height="980" role="img" aria-labelledby="title desc">
  <title id="title">cursor-sdk2api gateway vs raw Cursor CLI on Sonnet, Grok, and Composer</title>
  <desc id="desc">Grouped bar charts. Time to first tool is the comparable mark. Wall-clock to stop is different work: gateway stops at the first tool batch plus 1.5s settle; Cursor CLI finishes a native-tool turn. Values in seconds from the published live:timing current column and the 2026-09-07 CLI baseline. CLI text-only first byte was 8.58-9.81s; the gateway table has no text row.</desc>
  <rect width="1080" height="980" fill="#fffdfb"/>
  <rect x="0" y="0" width="8" height="980" fill="#ff6a33"/>
  <text x="36" y="32" fill="#111417" font-size="22" font-weight="750" font-family="ui-sans-serif, system-ui, sans-serif">This repo as a harness vs raw Cursor CLI</text>
  <text x="36" y="54" fill="#6b6560" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif">Same model families. Orange = cursor-sdk2api gateway (current live:timing Messages). Black = official agent CLI, User API Key, no HTTP proxy.</text>
