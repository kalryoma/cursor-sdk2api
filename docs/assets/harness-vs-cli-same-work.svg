<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 920" width="1080" height="920" role="img" aria-labelledby="title desc">
  <title id="title">Same-work harness protocol via cursor-sdk2api vs raw Cursor CLI</title>
  <desc id="desc">Text-only PONG. Orange is this gateway speaking Claude Code Messages, Codex Responses, or Grok Build Responses. Black is official Cursor CLI with no HTTP proxy. Luna and Grok use fast on both sides. Sonnet 4.6 has no fast slug on either catalog. CLI wall clock includes spawning agent. After first byte both sides finish in 0.13-0.34s.</desc>
  <rect width="1080" height="920" fill="#fffdfb"/>
  <rect x="0" y="0" width="8" height="920" fill="#ff6a33"/>
  <text x="36" y="32" fill="#111417" font-size="22" font-weight="750" font-family="ui-sans-serif, system-ui, sans-serif">Same-work: harness via this proxy vs raw Cursor CLI</text>
  <text x="36" y="54" fill="#6b6560" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif">One text PONG. Orange = cursor-sdk2api on that harness wire protocol. Black = agent CLI, User API Key, no proxy. Not the earlier tool-batch vs full-turn chart.</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="36" y="68" width="14" height="14" rx="3" fill="#ff6a33"/>
    <text x="56" y="80" fill="#111417" font-size="13">Proxy API (Claude Code / Codex / Grok Build protocol)</text>
    <rect x="500" y="68" width="14" height="14" rx="3" fill="#111417"/>
    <text x="520" y="80" fill="#111417" font-size="13">Raw Cursor CLI</text>
    <rect x="36" y="90" width="1008" height="22" rx="6" fill="#fff4ee"/>
    <text x="48" y="106" fill="#6b6560" font-size="12">After first byte, both finish in 0.13–0.34s. CLI’s extra 3–9s is agent startup, not the model racing the proxy.</text>
    <text x="80" y="140" fill="#111417" font-size="16" font-weight="700">Time to first semantic byte  ·  same work</text>
<text x="1044" y="140" fill="#6b6560" font-size="12" text-anchor="end">Seconds from request start. CLI includes agent process start.</text>
